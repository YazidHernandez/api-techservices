spring.application.name=api-techservices

# Render asigna el puerto en la variable PORT; en local se usa 8080
server.port=${PORT:8080}

# Conexion a MySQL. En Render se definen DB_URL, DB_USER y DB_PASSWORD como variables de entorno.
# Los valores despues de ":" son los de XAMPP local (root sin contrasena).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_techservices?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Las tablas se crean con el script SQL en phpMyAdmin, Hibernate no las toca
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.jackson.time-zone=America/Lima
